<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin - WANTOwash</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


<style>

body{

margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;

background:linear-gradient(135deg,#0d6efd,#00b4ff);

height:100vh;

display:flex;
justify-content:center;
align-items:center;

}



.login-box{

width:380px;

background:white;

padding:35px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.25);

}



.logo{

width:90px;
height:90px;

background:#0d6efd;

color:white;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:45px;

margin:auto;

}



.form-control{

border-radius:10px;

}



.btn{

border-radius:10px;

padding:10px;

}



.footer{

text-align:center;

margin-top:15px;

font-size:13px;

color:#777;

}



</style>

</head>


<body>


<div class="login-box">


<div class="text-center">


<div class="logo">

<i class="bi bi-bicycle"></i>

</div>


<h3 class="mt-3">

WANTO WASH

</h3>


<p class="text-muted">

Login Administrator

</p>


</div>




<form id="loginForm">


<div class="mb-3">


<label>

Username

</label>


<input

type="text"

id="username"

class="form-control"

placeholder="Username"

required>


</div>



<div class="mb-3">


<label>

Password

</label>


<input

type="password"

id="password"

class="form-control"

placeholder="Password"

required>


</div>




<button

class="btn btn-primary w-100">


<i class="bi bi-box-arrow-in-right"></i>

LOGIN


</button>



</form>




<div class="footer">


Username : <b>admin</b>

<br>

Password : <b>admin123</b>


</div>



</div>




<script>


// Jika sudah login langsung masuk dashboard

if(localStorage.getItem("login")=="true"){

window.location.href="dashboard.html";

}




document

.getElementById("loginForm")

.addEventListener("submit",function(e){


e.preventDefault();



let username =

document.getElementById("username").value;



let password =

document.getElementById("password").value;




// LOGIN ADMIN

if(username=="admin" && password=="admin123"){



localStorage.setItem(

"login",

"true"

);



localStorage.setItem(

"username",

username

);



alert("Login Berhasil");



window.location.href="dashboard.html";



}else{



alert("Username atau Password salah!");



}



});



</script>



</body>

</html>
