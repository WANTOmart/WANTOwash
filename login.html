<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Multi-User - WANTOwash</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0d6efd, #00b4ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
        }

        .logo {
            width: 90px;
            height: 90px;
            background: #0d6efd;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin: auto;
        }

        .form-control, .form-select {
            border-radius: 10px;
        }

        .btn {
            border-radius: 10px;
            padding: 10px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="text-center mb-3">
            <div class="logo">
                <i class="bi bi-bicycle"></i>
            </div>
            <h3 class="mt-3 fw-bold">WANTO WASH</h3>
            <p class="text-muted">Sistem Informasi Penggajian & Cuci Motor</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Role Akses</label>
                <select id="role" class="form-select" required>
                    <option value="admin">Admin</option>
                    <option value="owner">Owner (Pemilik)</option>
                    <option value="kasir">Kasir</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Masukkan Username" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Masukkan Password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">
                <i class="bi bi-box-arrow-in-right me-1"></i> LOGIN
            </button>
        </form>

        <div class="footer">
            <div class="fw-bold mb-1 text-center">Akun Default Sistem:</div>
            • <b>Admin:</b> admin / admin123<br>
            • <b>Owner:</b> owner / owner123<br>
            • <b>Kasir:</b> kasir / kasir123
        </div>
    </div>

    <script>
        // Daftar Akun Pengguna
        const users = {
            admin: { username: "admin", password: "admin123", nama: "Administrator", role: "admin" },
            owner: { username: "owner", password: "owner123", nama: "Pemilik (Owner)", role: "owner" },
            kasir: { username: "kasir", password: "kasir123", nama: "Kasir Utomo", role: "kasir" }
        };

        // Jika sudah login, langsung alihkan ke dashboard
        if (localStorage.getItem("login") === "true") {
            window.location.href = "dashboard.html";
        }

        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            let rolePilihan = document.getElementById("role").value;
            let usernameInput = document.getElementById("username").value.trim();
            let passwordInput = document.getElementById("password").value.trim();

            let akunTarget = users[rolePilihan];

            // Validasi login berdasarkan akun
            if (akunTarget && usernameInput === akunTarget.username && passwordInput === akunTarget.password) {
                // Simpan variabel sesi ke localStorage
                localStorage.setItem("login", "true");
                localStorage.setItem("username", akunTarget.username);
                localStorage.setItem("namaUser", akunTarget.nama);
                localStorage.setItem("role", akunTarget.role);

                alert(`Login Berhasil! Selamat datang, ${akunTarget.nama}`);
                window.location.href = "dashboard.html";
            } else {
                alert("Username, Password, atau Role yang Anda pilih tidak cocok!");
            }
        });
    </script>

</body>
