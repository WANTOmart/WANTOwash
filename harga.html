<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Harga - WANTO Wash</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100%;
background:#111827;
}

.logo{
padding:20px;
text-align:center;
color:white;
border-bottom:1px solid #333;
}

.logo h2{
color:#ff3b3b;
}

.logo span{
color:#2196f3;
}

.menu{
list-style:none;
margin-top:20px;
}

.menu li a{
display:block;
padding:15px 20px;
color:white;
text-decoration:none;
}

.menu li a:hover,
.menu li a.active{
background:#dc3545;
}

.content{
margin-left:250px;
padding:25px;
}

.card{
background:white;
border-radius:10px;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table th{
background:#dc3545;
color:white;
padding:12px;
}

table td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

input{
padding:10px;
width:100%;
border:1px solid #ccc;
border-radius:5px;
}

.row{
display:flex;
gap:15px;
margin-bottom:15px;
}

.col{
flex:1;
}

button{
padding:10px 18px;
border:none;
border-radius:5px;
cursor:pointer;
color:white;
}

.tambah{
background:#28a745;
}

.edit{
background:#ffc107;
color:black;
}

.hapus{
background:#dc3545;
}

button:hover{
opacity:.9;
}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

<h2>WANTO <span>Wash</span></h2>

<p>Sistem Kasir</p>

</div>

<ul class="menu">

<li><a href="dashboard.html"><i class="fa fa-home"></i> Dashboard</a></li>

<li><a href="kasir.html"><i class="fa fa-cash-register"></i> Kasir</a></li>

<li><a class="active" href="harga.html"><i class="fa fa-tags"></i> Daftar Harga</a></li>

<li><a href="laporan.html"><i class="fa fa-chart-line"></i> Laporan</a></li>

<li><a href="setting.html"><i class="fa fa-cog"></i> Setting</a></li>

</ul>

</div>

<div class="content">

<h1><i class="fa fa-tags"></i> Daftar Harga</h1>

<div class="card">

<h3>Tambah Paket</h3>

<br>

<div class="row">

<div class="col">

<input type="text" id="paket" placeholder="Nama Paket">

</div>

<div class="col">

<input type="number" id="harga" placeholder="Harga">

</div>

<div>

<button class="tambah" onclick="tambahData()">

<i class="fa fa-plus"></i>

Tambah

</button>

</div>

</div>

<table id="tabel">

<thead>

<tr>

<th>No</th>

<th>Nama Paket</th>

<th>Harga</th>

<th>Aksi</th>

</tr>

</thead>

<tbody>

<tr>

<td>1</td>

<td>Cuci Motor</td>

<td>Rp15.000</td>

<td>

<button class="edit">

<i class="fa fa-edit"></i>

</button>

<button class="hapus" onclick="hapusBaris(this)">

<i class="fa fa-trash"></i>

</button>

</td>

</tr>

<tr>

<td>2</td>

<td>Cuci + Semir Ban</td>

<td>Rp20.000</td>

<td>

<button class="edit">

<i class="fa fa-edit"></i>

</button>

<button class="hapus" onclick="hapusBaris(this)">

<i class="fa fa-trash"></i>

</button>

</td>

</tr>

<tr>

<td>3</td>

<td>Cuci Premium</td>

<td>Rp25.000</td>

<td>

<button class="edit">

<i class="fa fa-edit"></i>

</button>

<button class="hapus" onclick="hapusBaris(this)">

<i class="fa fa-trash"></i>

</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

<script>

function tambahData(){

let paket=document.getElementById("paket").value;

let harga=document.getElementById("harga").value;

if(paket=="" || harga==""){

alert("Lengkapi data");

return;

}

let table=document.getElementById("tabel").getElementsByTagName("tbody")[0];

let row=table.insertRow();

row.innerHTML=

"<td>"+table.rows.length+"</td>"+

"<td>"+paket+"</td>"+

"<td>Rp"+Number(harga).toLocaleString('id-ID')+"</td>"+

"<td><button class='edit'><i class='fa fa-edit'></i></button> <button class='hapus' onclick='hapusBaris(this)'><i class='fa fa-trash'></i></button></td>";

document.getElementById("paket").value="";

document.getElementById("harga").value="";

}

function hapusBaris(btn){

if(confirm("Hapus paket ini?")){

btn.parentNode.parentNode.remove();

}

}

</script>

</body>
</html>
