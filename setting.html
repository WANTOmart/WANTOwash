<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setting - WANTO Wash</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100%;
background:#111827;
}

.logo{
padding:20px;
text-align:center;
color:white;
border-bottom:1px solid #333;
}

.logo h2{
color:#ff3b3b;
}

.logo span{
color:#2196f3;
}

.menu{
list-style:none;
margin-top:20px;
}

.menu li a{
display:block;
padding:15px 20px;
text-decoration:none;
color:white;
}

.menu li a:hover,
.menu li a.active{
background:#dc3545;
}

.content{
margin-left:250px;
padding:25px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.row{
display:flex;
gap:20px;
margin-bottom:15px;
}

.col{
flex:1;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input,
textarea{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
}

textarea{
height:90px;
resize:none;
}

button{
padding:12px 20px;
background:#198754;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#157347;
}

.preview{
text-align:center;
margin-bottom:20px;
}

.preview img{
width:120px;
height:120px;
border-radius:50%;
border:3px solid #ddd;
object-fit:cover;
}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

<h2>WANTO <span>Wash</span></h2>

<p>Sistem Kasir</p>

</div>

<ul class="menu">

<li><a href="dashboard.html"><i class="fa fa-home"></i> Dashboard</a></li>

<li><a href="kasir.html"><i class="fa fa-cash-register"></i> Kasir</a></li>

<li><a href="harga.html"><i class="fa fa-tags"></i> Daftar Harga</a></li>

<li><a href="laporan.html"><i class="fa fa-chart-line"></i> Laporan</a></li>

<li><a class="active" href="setting.html"><i class="fa fa-cog"></i> Setting</a></li>

</ul>

</div>

<div class="content">

<h1><i class="fa fa-cog"></i> Pengaturan Aplikasi</h1>

<br>

<div class="card">

<div class="preview">

<img id="logoPreview" src="https://via.placeholder.com/120" alt="Logo">

</div>

<div class="row">

<div class="col">

<label>Logo Usaha</label>

<input type="file" id="logo" accept="image/*">

</div>

<div class="col">

<label>Nama Usaha</label>

<input type="text" value="WANTO Wash">

</div>

</div>

<div class="row">

<div class="col">

<label>Nama Pemilik</label>

<input type="text" placeholder="Nama Pemilik">

</div>

<div class="col">

<label>No. HP / WhatsApp</label>

<input type="text" placeholder="08xxxxxxxxxx">

</div>

</div>

<div class="row">

<div class="col">

<label>Email</label>

<input type="email" placeholder="email@gmail.com">

</div>

<div class="col">

<label>Jam Operasional</label>

<input type="text" placeholder="08.00 - 17.00">

</div>

</div>

<div class="row">

<div class="col">

<label>Alamat</label>

<textarea placeholder="Masukkan alamat usaha"></textarea>

</div>

</div>

<div class="row">

<div class="col">

<label>Footer Nota</label>

<textarea>Terima kasih telah mencuci motor di WANTO Wash. Kami tunggu kedatangan Anda kembali.</textarea>

</div>

</div>

<br>

<button onclick="simpan()">

<i class="fa fa-save"></i>

Simpan Pengaturan

</button>

</div>

</div>

<script>

document.getElementById("logo").addEventListener("change",function(e){

const file=e.target.files[0];

if(file){

document.getElementById("logoPreview").src=URL.createObjectURL(file);

}

});

function simpan(){

alert("Pengaturan berhasil disimpan.");

}

</script>

</body>
</html>
