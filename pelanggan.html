<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pelanggan - WANTO WASH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .sidebar {
            position: fixed;
            width: 250px;
            height: 100%;
            background: #0d6efd;
            color: white;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .sidebar h3 {
            text-align: center;
            padding: 20px;
            margin: 0;
            font-weight: bold;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            transition: background 0.2s;
        }

        .sidebar a:hover, .sidebar a.active {
            background: rgba(255, 255, 255, 0.2);
        }

        .content {
            margin-left: 250px;
            padding: 30px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>🛵 WANTO WASH</h3>
        <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="pelanggan.html" class="active"><i class="bi bi-people"></i> Data Pelanggan</a>
        <a href="motor.html"><i class="bi bi-bicycle"></i> Data Motor</a>
        <a href="paket.html"><i class="bi bi-tags"></i> Paket Cuci</a>
        <a href="transaksi.html"><i class="bi bi-cart-check"></i> Transaksi</a>
        <a href="pembayaran.html"><i class="bi bi-cash-stack"></i> Pembayaran</a>
        <a href="nota.html"><i class="bi bi-printer"></i> Nota</a>
        <a href="laporan.html"><i class="bi bi-bar-chart"></i> Laporan</a>
        <a href="karyawan.html"><i class="bi bi-person-badge"></i> Karyawan</a>
        <a href="pengaturan.html"><i class="bi bi-gear"></i> Pengaturan</a>
        <hr class="my-2 text-white-50">
        <a href="login.html" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0">Data Pelanggan</h2>
            <button class="btn btn-primary px-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#modalTambah">
                <i class="bi bi-plus-circle me-1"></i> Tambah Pelanggan
            </button>
        </div>

        <div class="card p-3">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th width="50">No</th>
                            <th>Nama</th>
                            <th>No HP</th>
                            <th>Pilihan Paket</th>
                            <th>Alamat</th>
                            <th width="100" class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalTambah" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Tambah Data Pelanggan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nama Pelanggan</label>
                        <input id="nama" class="form-control" placeholder="Contoh: Budi">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">No HP / WhatsApp</label>
                        <input id="hp" class="form-control" placeholder="Contoh: 08123456789">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Pilihan Paket Cuci</label>
                        <select id="paket" class="form-select">
                            <option value="Cuci Biasa (Rp 20.000)">Cuci Biasa - Rp 20.000</option>
                            <option value="Cuci + Semir Ban (Rp 25.000)">Cuci + Semir Ban - Rp 25.000</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Alamat</label>
                        <textarea id="alamat" class="form-control" rows="2" placeholder="Alamat lengkap"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-success" onclick="simpan()">
                        <i class="bi bi-check-circle me-1"></i> Simpan
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Cek Login
        if (localStorage.getItem("login") !== "true") {
            location.href = "login.html";
        }

        // Ambil Data Pelanggan dari LocalStorage
        let data = JSON.parse(localStorage.getItem("pelanggan")) || [];

        tampil();

        function tampil() {
            let html = "";
            
            if (data.length === 0) {
                html = `<tr><td colspan="6" class="text-center text-muted py-3">Belum ada data pelanggan.</td></tr>`;
            } else {
                data.forEach(function(item, index) {
                    html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="fw-semibold">${item.nama}</td>
                        <td>${item.hp || '-'}</td>
                        <td><span class="badge bg-danger-subtle text-danger border border-danger-subtle fw-medium fs-6">${item.paket || 'Cuci Biasa (Rp 20.000)'}</span></td>
                        <td>${item.alamat || '-'}</td>
                        <td class="text-center">
                            <button class="btn btn-danger btn-sm" onclick="hapus(${index})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>`;
                });
            }

            document.getElementById("tabel").innerHTML = html;
        }

        function simpan() {
            let nama = document.getElementById("nama").value.trim();
            let hp = document.getElementById("hp").value.trim();
            let paket = document.getElementById("paket").value;
            let alamat = document.getElementById("alamat").value.trim();

            if (nama === "") {
                alert("Nama pelanggan harus diisi!");
                return;
            }

            data.push({
                nama: nama,
                hp: hp,
                paket: paket,
                alamat: alamat
            });

            localStorage.setItem("pelanggan", JSON.stringify(data));

            // Tutup Modal
            const modalElement = document.getElementById("modalTambah");
            const modalInstance = bootstrap.Modal.getInstance(modalElement);
            if (modalInstance) {
                modalInstance.hide();
            }

            // Reset Input Form
            document.getElementById("nama").value = "";
            document.getElementById("hp").value = "";
            document.getElementById("paket").selectedIndex = 0;
            document.getElementById("alamat").value = "";

            tampil();
        }

        function hapus(index) {
            if (confirm("Apakah Anda yakin ingin menghapus data pelanggan ini?")) {
                data.splice(index, 1);
                localStorage.setItem("pelanggan", JSON.stringify(data));
                tampil();
            }
        }

        function logout() {
            localStorage.removeItem("login");
        }
    </script>
</body>
</html>
