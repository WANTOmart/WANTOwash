<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Pelanggan - WANTO WASH</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
}

.sidebar{
    position:fixed;
    width:250px;
    height:100%;
    background:#0d6efd;
    color:white;
}

.sidebar h3{
    text-align:center;
    padding:20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.2);
}

.content{
    margin-left:250px;
    padding:30px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}
</style>

</head>

<body>

<div class="sidebar">

<h3>🛵 WANTO WASH</h3>

<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="pelanggan.html"><i class="bi bi-people"></i> Data Pelanggan</a>
<a href="motor.html"><i class="bi bi-bicycle"></i> Data Motor</a>
<a href="paket.html"><i class="bi bi-tags"></i> Paket Cuci</a>
<a href="transaksi.html"><i class="bi bi-cart-check"></i> Transaksi</a>
<a href="pembayaran.html"><i class="bi bi-cash-stack"></i> Pembayaran</a>
<a href="nota.html"><i class="bi bi-printer"></i> Nota</a>
<a href="laporan.html"><i class="bi bi-bar-chart"></i> Laporan</a>
<a href="karyawan.html"><i class="bi bi-person-badge"></i> Karyawan</a>
<a href="pengaturan.html"><i class="bi bi-gear"></i> Pengaturan</a>

<hr>

<a href="login.html"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<div class="content">

<div class="d-flex justify-content-between mb-3">

<h2>Data Pelanggan</h2>

<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTambah">
<i class="bi bi-plus-circle"></i>
Tambah
</button>

</div>

<div class="card p-3">

<table class="table table-bordered table-hover">

<thead class="table-primary">

<tr>
<th>No</th>
<th>Nama</th>
<th>No HP</th>
<th>Alamat</th>
<th>Aksi</th>
</tr>

</thead>

<tbody id="tabel">

</tbody>

</table>

</div>

</div>

<!-- Modal -->

<div class="modal fade" id="modalTambah">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Tambah Pelanggan</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<input id="nama" class="form-control mb-2" placeholder="Nama">

<input id="hp" class="form-control mb-2" placeholder="No HP">

<textarea id="alamat" class="form-control" placeholder="Alamat"></textarea>

</div>

<div class="modal-footer">

<button class="btn btn-success" onclick="simpan()">
Simpan
</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

//cek login
if(localStorage.getItem("login")!="true"){
location.href="login.html";
}

let data =
JSON.parse(localStorage.getItem("pelanggan")) || [];

tampil();

function tampil(){

let html="";

data.forEach(function(item,index){

html += `
<tr>

<td>${index+1}</td>

<td>${item.nama}</td>

<td>${item.hp}</td>

<td>${item.alamat}</td>

<td>

<button class="btn btn-danger btn-sm"
onclick="hapus(${index})">

<i class="bi bi-trash"></i>

</button>

</td>

</tr>
`;

});

document.getElementById("tabel").innerHTML=html;

}

function simpan(){

let nama=document.getElementById("nama").value;
let hp=document.getElementById("hp").value;
let alamat=document.getElementById("alamat").value;

if(nama==""){

alert("Nama harus diisi");

return;

}

data.push({

nama:nama,

hp:hp,

alamat:alamat

});

localStorage.setItem(
"pelanggan",
JSON.stringify(data)
);

bootstrap.Modal.getInstance(
document.getElementById("modalTambah")
).hide();

document.getElementById("nama").value="";
document.getElementById("hp").value="";
document.getElementById("alamat").value="";

tampil();

}

function hapus(index){

if(confirm("Hapus pelanggan?")){

data.splice(index,1);

localStorage.setItem(
"pelanggan",
JSON.stringify(data)
);

tampil();

}

}

</script>

</body>
</html>
