<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANTOwash - Pilihan Paket & Laporan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light p-4">

<div class="container">
    <h3 class="mb-4 text-center fw-bold">WANTOwash - Transaksi Cuci</h3>

    <div class="row mb-4">
        <div class="col-md-6 mb-2">
            <div class="card bg-primary text-white p-3 shadow-sm">
                <h6>Total Pendapatan:</h6>
                <h3 id="sumFilter" class="fw-bold m-0">Rp 0</h3>
            </div>
        </div>
        <div class="col-md-6 mb-2">
            <div class="card bg-success text-white p-3 shadow-sm">
                <h6>Total Transaksi:</h6>
                <h3 id="countFilter" class="fw-bold m-0"><i class="bi bi-motorcycle"></i> 0 Transaksi</h3>
            </div>
        </div>
    </div>

    <div class="card shadow-sm p-3 mb-4">
        <h5 class="card-title mb-3">Laporan Transaksi</h5>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>No Trx</th>
                        <th>Tanggal</th>
                        <th>Pelanggan</th>
                        <th>Motor</th>
                        <th>Paket Cuci</th>
                        <th class="text-end">Total</th>
                    </tr>
                </thead>
                <tbody id="tabelLaporan">
                    </tbody>
                <tfoot>
                    <tr class="fw-bold table-secondary">
                        <td colspan="6" class="text-end">Grand Total:</td>
                        <td id="grandTotalTabel" class="text-end">Rp 0</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<script>
// --- DATA DUMMY TRANSAKSI DENGAN PILIHAN PAKET ---
const dataTransaksi = [
    {
        noTrx: "TRX-001",
        tanggal: "2026-03-30",
        namaPelanggan: "Budi",
        namaMotor: "Vario 150",
        paket: "Cuci Biasa",
        total: 20000
    },
    {
        noTrx: "TRX-002",
        tanggal: "2026-03-30",
        namaPelanggan: "Andi",
        namaMotor: "NMAX",
        paket: "Cuci + Semir Ban",
        total: 25000
    },
    {
        noTrx: "TRX-003",
        tanggal: "2026-03-30",
        namaPelanggan: "Siti",
        namaMotor: "Beat",
        paket: "Cuci Biasa",
        total: 20000
    }
];

// Helper terpisah untuk merapikan logika ekstraksi nama paket
function formatNamaPaket(paket) {
    if (Array.isArray(paket)) {
        return paket
            .map(p => (typeof p === 'object' && p !== null) ? (p.nama || p.namaPaket || '-') : p)
            .filter(Boolean)
            .join(", ") || "-";
    }
    if (typeof paket === 'object' && paket !== null) {
        return paket.nama || paket.namaPaket || "-";
    }
    if (typeof paket === 'string' && paket.trim() !== "") {
        return paket;
    }
    return "-";
}

function tampilLaporan(listData) {
    // Memastikan listData selalu berbentuk Array aman
    const data = Array.isArray(listData) ? listData : [];
    let totalTabel = 0;
    let html = "";

    if (data.length === 0) {
        html = `<tr><td colspan="7" class="text-center text-muted py-3">Tidak ada data transaksi yang sesuai.</td></tr>`;
    } else {
        html = data.map((item, index) => {
            const totalNominal = Number(item.total) || 0;
            totalTabel += totalNominal;

            const namaPaket = formatNamaPaket(item.paket);

            return `
            <tr>
                <td>${index + 1}</td>
                <td class="fw-bold">${item.nomor || item.noTrx || '-'}</td>
                <td>${item.tanggal || '-'}</td>
                <td class="fw-semibold">${item.pelanggan || item.namaPelanggan || '-'}</td>
                <td>${item.motor || item.namaMotor || '-'}</td>
                <td><span class="badge bg-danger-subtle text-danger border border-danger-subtle fw-medium fs-6">${namaPaket}</span></td>
                <td class="fw-semibold text-end">Rp ${totalNominal.toLocaleString("id-ID")}</td>
            </tr>`;
        }).join('');
    }

    // Format mata uang sekali untuk efisiensi
    const formattedTotal = "Rp " + totalTabel.toLocaleString("id-ID");

    // Rendering ke DOM
    document.getElementById("tabelLaporan").innerHTML = html;
    document.getElementById("grandTotalTabel").innerHTML = formattedTotal;
    document.getElementById("sumFilter").innerHTML = formattedTotal;
    document.getElementById("countFilter").innerHTML = `<i class="bi bi-motorcycle"></i> ${data.length} Transaksi`;
}

// Jalankan fungsi saat halaman pertama kali dimuat
document.addEventListener("DOMContentLoaded", function() {
    tampilLaporan(dataTransaksi);
});
</script>

</body>
</html>
