<div class="modal fade" id="modalBayar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content style-modal nota-container" id="areaCetakNota">
                
                <img src="img/logo.png" class="watermark-bg" id="imgWatermark" alt="Watermark Logo" onerror="this.onerror=null; this.src='img/logo.jpeg';">

                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="bi bi-calculator me-2"></i>Kalkulator Pembayaran</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                
                <div class="modal-body p-4 nota-content">
                    <div class="text-center mb-3">
                        <img src="img/logo.png" id="imgLogoHeader" alt="Logo WANTOwash" 
                             style="width: 75px; height: 75px; object-fit: contain; margin-bottom: 5px;" 
                             onerror="this.onerror=null; this.src='img/logo.jpeg';">
                        <h4 class="fw-bold m-0">WANTO<span class="text-primary">wash</span></h4>
                        <small class="text-muted">Struk Pembayaran Cuci Motor</small>
                    </div>

                    <hr>

                  <form id="formPembayaran">
                      <input type="hidden" id="indexTransaksi">
                    
                      <div class="mb-2 row">
                          <label class="col-sm-5 col-form-label fw-semibold text-muted">No. Nota</label>
                          <div class="col-sm-7">
                              <input type="text" id="valNota" class="form-control-plaintext fw-bold" readonly>
                          </div>
                      </div>
                      <div class="mb-2 row">
                          <label class="col-sm-5 col-form-label fw-semibold text-muted">Pelanggan</label>
                          <div class="col-sm-7">
                              <input type="text" id="valPelanggan" class="form-control-plaintext" readonly>
                          </div>
                      </div>
                      <div class="mb-2 row">
                          <label class="col-sm-5 col-form-label fw-semibold text-muted">Paket Cuci</label>
                          <div class="col-sm-7">
                              <input type="text" id="valPaket" class="form-control-plaintext" readonly>
                          </div>
                      </div>
                      <div class="mb-3 row">
                          <label class="col-sm-5 col-form-label fw-semibold text-muted">Total Tagihan</label>
                          <div class="col-sm-7">
                              <input type="text" id="valTotalTagihanText" class="form-control-plaintext fw-bold text-success fs-5" readonly>
                              <input type="hidden" id="valTotalTagihan">
                          </div>
                      </div>

                      <hr>

                      <div class="mb-3">
                          <label class="form-label fw-semibold">Metode Pembayaran</label>
                          <select id="selectMetode" class="form-select" required>
                              <option value="Tunai">Tunai (Cash)</option>
                              <option value="QRIS">QRIS / Transfer</option>
                          </select>
                      </div>

                      <div class="mb-3">
                          <label class="form-label fw-semibold">Uang Tunai Diterima (Rp)</label>
                          <input type="number" id="inputUangBayar" class="form-control" placeholder="Masukkan jumlah uang..." required>
                      </div>

                      <div class="mb-3 p-3 bg-light rounded-3">
                          <div class="d-flex justify-content-between align-items-center">
                              <span class="fw-semibold text-muted">Kembalian:</span>
                              <span id="valKembalian" class="fw-bold fs-5 text-primary">Rp 0</span>
                          </div>
                      </div>
                  </form>
                </div>

                <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                      <button type="button" class="btn btn-success fw-bold" onclick="prosesBayar()"><i class="bi bi-check-circle me-1"></i> Selesaikan Pembayaran</button>
                      <button type="button" class="btn btn-primary fw-bold" onclick="cetakNota()"><i class="bi bi-printer me-1"></i> Cetak Nota</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        if (localStorage.getItem("login") !== "true") {
            window.location.href = "login.html";
        }

        const userRole = localStorage.getItem("role") || "kasir";

        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("active");
            document.getElementById("overlay").classList.toggle("active");
        }

        function terapkanHakAkses() {
            document.getElementById("userRoleBadge").innerText = userRole;
            if (userRole === "admin" || userRole === "kasir") {
                let ownerMenus = document.querySelectorAll(".menu-owner-only");
                ownerMenus.forEach(menu => {
                    menu.style.display = "none";
                });
            }
        }

        function muatPembayaran() {
            let transaksi = JSON.parse(localStorage.getItem("transaksi")) || [];
            let tbody = document.getElementById("tabelPembayaranBody");
            tbody.innerHTML = "";

            if (transaksi.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">Belum ada data transaksi pembayaran.</td></tr>`;
                return;
            }

            transaksi.forEach((t, idx) => {
                let statusBadge = t.status === "Lunas" ? 
                    `<span class="badge bg-success">Lunas</span>` : 
                    `<span class="badge bg-warning text-dark">Proses</span>`;
                
                let btnAksi = t.status === "Lunas" ?
                    `<button class="btn btn-sm btn-outline-primary" onclick="bukaModalBayar(${idx})"><i class="bi bi-printer"></i> Cetak Nota</button>` :
                    `<button class="btn btn-sm btn-primary fw-bold" onclick="bukaModalBayar(${idx})"><i class="bi bi-cash-stack"></i> Bayar</button>`;

                tbody.innerHTML += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td class="fw-bold">${t.nota}</td>
                        <td>${t.pelanggan || '-'}</td>
                        <td>${t.paket || '-'}</td>
                        <td class="fw-bold text-success">Rp ${Number(t.total || 0).toLocaleString("id-ID")}</td>
                        <td>${t.metode || '-'}</td>
                        <td>${statusBadge}</td>
                        <td class="text-center">${btnAksi}</td>
                    </tr>
                `;
            });
        }

        function bukaModalBayar(idx) {
            let transaksi = JSON.parse(localStorage.getItem("transaksi")) || [];
            let t = transaksi[idx];

            document.getElementById("indexTransaksi").value = idx;
            document.getElementById("valNota").value = t.nota;
            document.getElementById("valPelanggan").value = t.pelanggan || '-';
            document.getElementById("valPaket").value = t.paket || '-';
            document.getElementById("valTotalTagihan").value = t.total || 0;
            document.getElementById("valTotalTagihanText").value = "Rp " + Number(t.total || 0).toLocaleString("id-ID");
            document.getElementById("inputUangBayar").value = t.bayar || "";
            document.getElementById("selectMetode").value = t.metode || "Tunai";
            
            hitungKembalian();

            let modal = new bootstrap.Modal(document.getElementById("modalBayar"));
            modal.show();
        }

        document.getElementById("inputUangBayar").addEventListener("input", hitungKembalian);

        function hitungKembalian() {
            let total = Number(document.getElementById("valTotalTagihan").value) || 0;
            let bayar = Number(document.getElementById("inputUangBayar").value) || 0;
            let kembalian = bayar - total;

            let elKembalian = document.getElementById("valKembalian");
            if (kembalian >= 0) {
                elKembalian.innerText = "Rp " + kembalian.toLocaleString("id-ID");
                elKembalian.className = "fw-bold fs-5 text-success";
            } else {
                elKembalian.innerText = "Rp " + kembalian.toLocaleString("id-ID");
                elKembalian.className = "fw-bold fs-5 text-danger";
            }
        }

        function prosesBayar() {
            let idx = document.getElementById("indexTransaksi").value;
            let metode = document.getElementById("selectMetode").value;
            let bayar = Number(document.getElementById("inputUangBayar").value) || 0;
            let total = Number(document.getElementById("valTotalTagihan").value) || 0;

            if (bayar < total) {
                alert("Uang tunai kurang dari total tagihan!");
                return;
            }

            let transaksi = JSON.parse(localStorage.getItem("transaksi")) || [];
            transaksi[idx].status = "Lunas";
            transaksi[idx].metode = metode;
            transaksi[idx].bayar = bayar;
            transaksi[idx].kembalian = bayar - total;

            localStorage.setItem("transaksi", JSON.stringify(transaksi));
            muatPembayaran();
            alert("Pembayaran berhasil diselesaikan!");
        }

        function cetakNota() {
            window.print();
        }

        function logout() {
            if (confirm("Apakah Anda yakin ingin keluar?")) {
                localStorage.removeItem("login");
                localStorage.removeItem("username");
                localStorage.removeItem("namaUser");
                localStorage.removeItem("role");
                window.location.href = "login.html";
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            terapkanHakAkses();
            muatPembayaran();
        });
    </script>
</body>

</html>
