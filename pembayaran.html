<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran - WANTO WASH</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
}
.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100%;
    background:#0d6efd;
    color:#fff;
}
.sidebar h3{
    text-align:center;
    padding:20px;
    border-bottom:1px solid rgba(255,255,255,.2);
}
.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:15px 20px;
}
.sidebar a:hover{
    background:rgba(255,255,255,.15);
}
.content{
    margin-left:250px;
    padding:30px;
}
.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}
</style>

</head>
<body>

<div class="sidebar">

<h3>🛵 WANTO WASH</h3>

<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="transaksi.html"><i class="bi bi-cart-check"></i> Transaksi</a>
<a href="pelanggan.html"><i class="bi bi-people"></i> Pelanggan</a>
<a href="motor.html"><i class="bi bi-bicycle"></i> Data Motor</a>
<a href="paket.html"><i class="bi bi-tags"></i> Paket Cuci</a>
<a href="pembayaran.html"><i class="bi bi-cash-stack"></i> Pembayaran</a>
<a href="laporan.html"><i class="bi bi-file-earmark-bar-graph"></i> Laporan</a>
<a href="login.html"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<div class="content">

<h2 class="mb-4">Pembayaran</h2>

<div class="card p-4">

<div class="row">

<div class="col-md-6">

<label>Nama Pelanggan</label>
<input type="text" id="nama" class="form-control mb-3" value="Budi">

<label>Paket Cuci</label>
<select id="paket" class="form-select mb-3" onchange="ubahHarga()">
<option value="20000">Cuci Biasa - Rp20.000</option>
<option value="25000">Cuci + Semir Ban - Rp25.000</option>
<option value="35000">Cuci Premium - Rp35.000</option>
<option value="40000">Steam - Rp40.000</option>
</select>

<label>Total Bayar</label>
<input type="text" id="total" class="form-control mb-3" readonly value="Rp20.000">

<label>Uang Dibayar</label>
<input type="number" id="bayar" class="form-control mb-3" placeholder="Masukkan Nominal">

<label>Kembalian</label>
<input type="text" id="kembali" class="form-control mb-3" readonly>

<button class="btn btn-success" onclick="hitung()">
<i class="bi bi-calculator"></i> Hitung
</button>

<button class="btn btn-primary" onclick="window.print()">
<i class="bi bi-printer"></i> Cetak Nota
</button>

</div>

</div>

</div>

</div>

<script>

function rupiah(angka){
    return "Rp" + angka.toLocaleString("id-ID");
}

function ubahHarga(){
    let total = parseInt(document.getElementById("paket").value);
    document.getElementById("total").value = rupiah(total);
}

function hitung(){

let total=parseInt(document.getElementById("paket").value);
let bayar=parseInt(document.getElementById("bayar").value);

if(isNaN(bayar)){
alert("Masukkan nominal pembayaran.");
return;
}

if(bayar<total){
alert("Uang pelanggan kurang.");
return;
}

let kembali=bayar-total;

document.getElementById("kembali").value=rupiah(kembali);

alert("Pembayaran Berhasil");

}

</script>

</body>
</html>
