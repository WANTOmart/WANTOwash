<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANTO Wash - Dashboard Kasir</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* --- RESET & BASIC STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f4f6f9;
            color: #333;
            min-height: 100vh;
        }

        /* --- MOBILE NAVBAR HEADER --- */
        .mobile-navbar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #111827;
            color: white;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1001;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .mobile-navbar .menu-toggle {
            font-size: 22px;
            cursor: pointer;
            color: white;
            background: none;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
        }

        .mobile-navbar .menu-toggle:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .mobile-navbar .brand-name {
            font-size: 18px;
            font-weight: bold;
            color: #ff3b3b;
            letter-spacing: 0.5px;
        }

        .mobile-navbar .brand-name span {
            color: #2196f3;
        }

        /* --- SIDEBAR NAVIGASI --- */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100%;
            background: #111827;
            color: white;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        .logo {
            padding: 20px 15px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }

        .logo img {
            width: 75px;
            height: auto;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .logo h2 {
            color: #ff3b3b;
            font-size: 22px;
            font-weight: 700;
        }

        .logo span {
            color: #2196f3;
        }

        .logo small {
            color: #9ca3af;
            font-size: 12px;
            display: block;
            margin-top: 2px;
        }

        .menu {
            list-style: none;
            margin-top: 10px;
        }

        .menu li {
            border-bottom: 1px solid #1f2937;
        }

        .menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: #d1d5db;
            text-decoration: none;
            font-size: 15px;
            transition: background 0.2s, color 0.2s;
        }

        .menu li a i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .menu li a:hover, .menu li.active a {
            background: #dc3545;
            color: white;
        }

        /* --- OVERLAY MOBILE --- */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            display: block;
            opacity: 1;
        }

        /* --- CONTENT MAIN AREA --- */
        .content {
            margin-left: 250px;
            padding: 25px;
            transition: margin-left 0.3s ease;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.04);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            color: #111827;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
            margin-top: 4px;
        }

        /* --- STATISTIC CARDS GRID --- */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card h3 {
            font-size: 26px;
            margin-top: 12px;
            color: #111827;
        }

        .card p {
            color: #6b7280;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card i {
            font-size: 28px;
        }

        .red { border-left: 4px solid #dc3545; }
        .red i { color: #dc3545; }

        .blue { border-left: 4px solid #0d6efd; }
        .blue i { color: #0d6efd; }

        .green { border-left: 4px solid #198754; }
        .green i { color: #198754; }

        .orange { border-left: 4px solid #fd7e14; }
        .orange i { color: #fd7e14; }

        /* --- TABEL TRANSAKSI --- */
        .table-container {
            margin-top: 25px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.04);
        }

        .table-container h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #111827;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
        }

        table th {
            background: #dc3545;
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
        }

        table td {
            padding: 12px 15px;
            border-bottom: 1px solid #f3f4f6;
            font-size: 14px;
            color: #374151;
        }

        table tr:last-child td {
            border-bottom: none;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success { background: #d1e7dd; color: #0f5132; }
        .badge-warning { background: #fff3cd; color: #664d03; }

        .btn-action {
            margin-top: 20px;
            padding: 12px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-action:hover {
            background: #bb2d3b;
        }

        /* --- RESPONSIVE MOBILE & TABLET RULES --- */
        @media (max-width: 768px) {
            .mobile-navbar {
                display: flex;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .content {
                margin-left: 0;
                padding: 75px 15px 20px 15px;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .card {
                padding: 15px;
            }

            .card h3 {
                font-size: 20px;
            }

            .card p {
                font-size: 11px;
            }

            .card i {
                font-size: 22px;
            }

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .table-container {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .btn-action {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
