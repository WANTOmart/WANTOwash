<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaksi Cuci - WANTO WASH</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
}
.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100%;
    background:#0d6efd;
    color:#fff;
}
.sidebar h3{
    text-align:center;
    padding:20px;
    border-bottom:1px solid rgba(255,255,255,.2);
}
.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:15px 20px;
}
.sidebar a:hover{
    background:rgba(255,255,255,.15);
}
.content{
    margin-left:250px;
    padding:30px;
}
.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}
</style>
</head>

<body>

<div class="sidebar">

<h3>🛵 WANTO WASH</h3>

<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="transaksi.html"><i class="bi bi-cart-check"></i> Transaksi</a>
<a href="pelanggan.html"><i class="bi bi-people"></i> Pelanggan</a>
<a href="motor.html"><i class="bi bi-bicycle"></i> Data Motor</a>
<a href="paket.html"><i class="bi bi-tags"></i> Paket Cuci</a>
<a href="karyawan.html"><i class="bi bi-person-badge"></i> Karyawan</a>
<a href="laporan.html"><i class="bi bi-file-earmark-bar-graph"></i> Laporan</a>
<a href="pengaturan.html"><i class="bi bi-gear"></i> Pengaturan</a>

<hr>

<a href="login.html"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<div class="content">

<div class="d-flex justify-content-between mb-3">
<h2>Transaksi Cuci</h2>

<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTambah">
<i class="bi bi-plus-circle"></i> Transaksi Baru
</button>
</div>

<div class="card p-3">

<table class="table table-bordered table-hover">

<thead class="table-primary">
<tr>
<th>No</th>
<th>Pelanggan</th>
<th>Motor</th>
<th>Plat</th>
<th>Paket</th>
<th>Harga</th>
<th>Status</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tabel">

<tr>
<td>1</td>
<td>Budi</td>
<td>Honda Beat</td>
<td>P 1234 AB</td>
<td>Cuci Premium</td>
<td>Rp35.000</td>
<td><span class="badge bg-success">Selesai</span></td>
<td>
<button class="btn btn-danger btn-sm" onclick="hapus(this)">Hapus</button>
</td>
</tr>

</tbody>

</table>

</div>

</div>

<div class="modal fade" id="modalTambah">
<div class="modal-dialog">
<div class="modal-content">

<div class="modal-header">
<h5>Tambah Transaksi</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<input id="nama" class="form-control mb-2" placeholder="Nama Pelanggan">

<input id="motor" class="form-control mb-2" placeholder="Motor">

<input id="plat" class="form-control mb-2" placeholder="Plat Nomor">

<select id="paket" class="form-select mb-2" onchange="hargaOtomatis()">
<option value="">Pilih Paket</option>
<option value="20000">Cuci Biasa</option>
<option value="25000">Cuci + Semir Ban</option>
<option value="35000">Cuci Premium</option>
<option value="40000">Steam</option>
</select>

<input id="harga" class="form-control mb-2" readonly placeholder="Harga">

<select id="status" class="form-select">
<option>Antri</option>
<option>Dicuci</option>
<option>Selesai</option>
</select>

</div>

<div class="modal-footer">

<button class="btn btn-success" onclick="simpan()">Simpan</button>

</div>

</div>
</div>
</div>

<script>

let no=2;

function hargaOtomatis(){

let paket=document.getElementById("paket");
let harga=paket.value;

if(harga!=""){
document.getElementById("harga").value=
"Rp"+parseInt(harga).toLocaleString("id-ID");
}

}

function simpan(){

let nama=document.getElementById("nama").value;
let motor=document.getElementById("motor").value;
let plat=document.getElementById("plat").value;

let paket=document.getElementById("paket");
let paketText=paket.options[paket.selectedIndex].text;

let harga=document.getElementById("harga").value;
let status=document.getElementById("status").value;

let warna="secondary";

if(status=="Antri") warna="danger";
if(status=="Dicuci") warna="warning";
if(status=="Selesai") warna="success";

document.getElementById("tabel").innerHTML += `
<tr>
<td>${no++}</td>
<td>${nama}</td>
<td>${motor}</td>
<td>${plat}</td>
<td>${paketText}</td>
<td>${harga}</td>
<td><span class="badge bg-${warna}">${status}</span></td>
<td>
<button class="btn btn-danger btn-sm" onclick="hapus(this)">Hapus</button>
</td>
</tr>
`;

bootstrap.Modal.getInstance(document.getElementById("modalTambah")).hide();

document.getElementById("nama").value="";
document.getElementById("motor").value="";
document.getElementById("plat").value="";
document.getElementById("paket").selectedIndex=0;
document.getElementById("harga").value="";
document.getElementById("status").selectedIndex=0;

}

function hapus(btn){

if(confirm("Hapus transaksi?")){
btn.parentElement.parentElement.remove();
}

}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
