<div class="content">

<h2 class="mb-4">
<i class="bi bi-cart-check"></i>
Transaksi Cuci Motor
</h2>

<div class="card p-4">

<div class="row">

<div class="col-md-6">

<label>Nama Pelanggan</label>

<select id="pelanggan" class="form-select mb-3">

<option value="">
-- Pilih Pelanggan --
</option>

</select>

</div>

<div class="col-md-6">

<label>Motor</label>

<select id="motor" class="form-select mb-3">

<option value="">
-- Pilih Motor --
</option>

</select>

</div>

</div>

<div class="row">

<div class="col-md-6">

<label>Paket Cuci</label>

<select id="paket" class="form-select mb-3">

<option value="">
-- Pilih Paket --
</option>

</select>

</div>

<div class="col-md-6">

<label>Harga</label>

<input
type="text"
id="harga"
class="form-control mb-3"
readonly>

</div>

</div>

<div class="row">

<div class="col-md-6">

<label>Tanggal</label>

<input
type="date"
id="tanggal"
class="form-control">

</div>

<div class="col-md-6">

<label>Total Bayar</label>

<input
type="text"
id="total"
class="form-control"
readonly>

</div>

</div>

<br>

<button
class="btn btn-success"
onclick="simpanTransaksi()">

<i class="bi bi-save"></i>

Simpan Transaksi

</button>

</div>

<br>

<div class="card p-3">

<h4>Data Transaksi</h4>

<table class="table table-bordered table-striped">

<thead class="table-primary">

<tr>

<th>No</th>
<th>Tanggal</th>
<th>Pelanggan</th>
<th>Motor</th>
<th>Paket</th>
<th>Total</th>
<th>Status</th>

</tr>

</thead>

<tbody id="tabelTransaksi">

</tbody>

</table>

</div>
