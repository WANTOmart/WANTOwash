<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaksi Cuci - WANTO WASH</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100%;
    background:#0d6efd;
    color:#fff;
}

.sidebar h3{
    text-align:center;
    padding:20px;
}

.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
}

.content{
    margin-left:250px;
    padding:30px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

</style>

</head>

<body>

<div class="sidebar">

<h3>🛵 WANTO WASH</h3>

<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="pelanggan.html"><i class="bi bi-people"></i> Data Pelanggan</a>
<a href="motor.html"><i class="bi bi-bicycle"></i> Data Motor</a>
<a href="paket.html"><i class="bi bi-tags"></i> Paket Cuci</a>
<a href="transaksi.html"><i class="bi bi-cart-check"></i> Transaksi</a>
<a href="pembayaran.html"><i class="bi bi-cash-stack"></i> Pembayaran</a>
<a href="nota.html"><i class="bi bi-printer"></i> Cetak Nota</a>
<a href="laporan.html"><i class="bi bi-bar-chart"></i> Laporan</a>
<a href="karyawan.html"><i class="bi bi-person-badge"></i> Karyawan</a>
<a href="pengaturan.html"><i class="bi bi-gear"></i> Pengaturan</a>

<hr>

<a href="login.html"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<div class="content">

<h2 class="mb-4">
<i class="bi bi-cart-check"></i>
Transaksi Cuci Motor
</h2>

<div class="card p-4">

<div class="row">

<div class="col-md-6">

<label>Nama Pelanggan</label>

<select id="pelanggan" class="form-select mb-3">

<option value="">
-- Pilih Pelanggan --
</option>

</select>

</div>

<div class="col-md-6">

<label>Motor</label>

<select id="motor" class="form-select mb-3">

<option value="">
-- Pilih Motor --
</option>

</select>

</div>

</div>

<div class="row">

<div class="col-md-6">

<label>Paket Cuci</label>

<select id="paket" class="form-select mb-3">

<option value="">
-- Pilih Paket --
</option>

</select>

</div>

<div class="col-md-6">

<label>Harga</label>

<input
type="text"
id="harga"
class="form-control mb-3"
readonly>

</div>

</div>

<div class="row">

<div class="col-md-6">

<label>Tanggal</label>

<input
type="date"
id="tanggal"
class="form-control">

</div>

<div class="col-md-6">

<label>Total Bayar</label>

<input
type="text"
id="total"
class="form-control"
readonly>

</div>

</div>

<br>

<button
class="btn btn-success"
onclick="simpanTransaksi()">

<i class="bi bi-save"></i>

Simpan Transaksi

</button>

</div>

<br>

<div class="card p-3">

<h4>Data Transaksi</h4>

<table class="table table-bordered table-striped">

<thead class="table-primary">

<tr>

<th>No</th>
<th>Tanggal</th>
<th>Pelanggan</th>
<th>Motor</th>
<th>Paket</th>
<th>Total</th>
<th>Status</th>

</tr>

</thead>

<tbody id="tabelTransaksi">

</tbody>

</table>

</div>
<script>

if(localStorage.getItem("login")!="true"){
    location.href="login.html";
}

document.getElementById("tanggal").value=
new Date().toISOString().split("T")[0];

let pelanggan=
JSON.parse(localStorage.getItem("pelanggan")) || [];

let motor=
JSON.parse(localStorage.getItem("motor")) || [];

let paket=
JSON.parse(localStorage.getItem("paket")) || [];

let transaksi=
JSON.parse(localStorage.getItem("transaksi")) || [];

//========================
// TAMPILKAN PELANGGAN
//========================

let pilihPelanggan=document.getElementById("pelanggan");

pelanggan.forEach(function(item){

let option=document.createElement("option");

option.value=item.nama;

option.text=item.nama;

pilihPelanggan.appendChild(option);

});

//========================
// SAAT PELANGGAN DIPILIH
//========================

pilihPelanggan.onchange=function(){

let html="<option value=''>-- Pilih Motor --</option>";

motor.forEach(function(item){

if(item.pemilik==this.value){

html+=`
<option value="${item.merk} ${item.tipe} (${item.plat})">

${item.merk} ${item.tipe} (${item.plat})

</option>
`;

}

},this);

document.getElementById("motor").innerHTML=html;

}

//========================
// TAMPILKAN PAKET
//========================

let pilihPaket=document.getElementById("paket");

paket.forEach(function(item){

let option=document.createElement("option");

option.value=item.nama;

option.text=item.nama;

option.dataset.harga=item.harga;

pilihPaket.appendChild(option);

});

//========================
// SAAT PAKET DIPILIH
//========================

pilihPaket.onchange=function(){

let harga=this.options[this.selectedIndex].dataset.harga || 0;

document.getElementById("harga").value=
"Rp "+Number(harga).toLocaleString("id-ID");

document.getElementById("total").value=
"Rp "+Number(harga).toLocaleString("id-ID");

}

//========================
// TAMPILKAN TRANSAKSI
//========================

tampil();

function tampil(){

let html="";

transaksi.forEach(function(item,index){

html+=`

<tr>

<td>${index+1}</td>

<td>${item.tanggal}</td>

<td>${item.pelanggan}</td>

<td>${item.motor}</td>

<td>${item.paket}</td>

<td>Rp ${Number(item.total).toLocaleString("id-ID")}</td>

<td>

<span class="badge bg-success">

${item.status}

</span>

</td>

</tr>

`;

});

document.getElementById("tabelTransaksi").innerHTML=html;

}

</script>

</body>
</html>
