    text-align:center;

    display:block;

    margin-left:250px;

    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

<body>

<div class="sidebar">

<h3>🛵 WANTO WASH</h3>

<div class="content">

<h2 class="mb-4">Pengaturan Harga Paket Cuci</h2>

<div class="card p-4">

<div class="mb-3">
<label class="form-label">Harga Cuci Biasa</label>
<input type="number" id="biasa" class="form-control" value="20000">
</div>

<div class="mb-3">
<label class="form-label">Harga Cuci + Semir Ban</label>
<input type="number" id="semir" class="form-control" value="25000">
</div>

<div class="mb-3">
<label class="form-label">Harga Cuci Premium</label>
<input type="number" id="premium" class="form-control" value="35000">
</div>

<div class="mb-3">
<label class="form-label">Harga Steam</label>
<input type="number" id="steam" class="form-control" value="40000">
</div>

<button class="btn btn-success" onclick="simpan()">
<i class="bi bi-save"></i> Simpan Pengaturan
</button>

<hr>

<h5 class="mt-4">Harga Saat Ini</h5>

<table class="table table-bordered">

<tr>
<th>Paket</th>
<th>Harga</th>
</tr>

<tr>
<td>Cuci Biasa</td>
<td id="hb">Rp20.000</td>
</tr>

<tr>
<td>Cuci + Semir Ban</td>
<td id="hs">Rp25.000</td>
</tr>

<tr>
<td>Cuci Premium</td>
<td id="hp">Rp35.000</td>
</tr>

<tr>
<td>Steam</td>
<td id="ht">Rp40.000</td>
</tr>

</table>

</div>

</div>

<script>

function rupiah(angka){
return "Rp" + parseInt(angka).toLocaleString("id-ID");
}

function simpan(){

let biasa=document.getElementById("biasa").value;
let semir=document.getElementById("semir").value;
let premium=document.getElementById("premium").value;
let steam=document.getElementById("steam").value;

document.getElementById("hb").innerHTML=rupiah(biasa);
document.getElementById("hs").innerHTML=rupiah(semir);
document.getElementById("hp").innerHTML=rupiah(premium);
document.getElementById("ht").innerHTML=rupiah(steam);

alert("Pengaturan harga berhasil disimpan.");

}

</script>

</body>
