<div class="content">

<h2 class="mb-4">Pengaturan Harga Paket Cuci</h2>

<div class="card p-4">

<div class="mb-3">
<label class="form-label">Harga Cuci Biasa</label>
<input type="number" id="biasa" class="form-control" value="20000">
</div>

<div class="mb-3">
<label class="form-label">Harga Cuci + Semir Ban</label>
<input type="number" id="semir" class="form-control" value="25000">
</div>

<div class="mb-3">
<label class="form-label">Harga Cuci Premium</label>
<input type="number" id="premium" class="form-control" value="35000">
</div>

<div class="mb-3">
<label class="form-label">Harga Steam</label>
<input type="number" id="steam" class="form-control" value="40000">
</div>

<button class="btn btn-success" onclick="simpan()">
<i class="bi bi-save"></i> Simpan Pengaturan
</button>

<hr>

<h5 class="mt-4">Harga Saat Ini</h5>

<table class="table table-bordered">

<tr>
<th>Paket</th>
<th>Harga</th>
</tr>

<tr>
<td>Cuci Biasa</td>
<td id="hb">Rp20.000</td>
</tr>

<tr>
<td>Cuci + Semir Ban</td>
<td id="hs">Rp25.000</td>
</tr>

<tr>
<td>Cuci Premium</td>
<td id="hp">Rp35.000</td>
</tr>

<tr>
<td>Steam</td>
<td id="ht">Rp40.000</td>
</tr>

<script>

function rupiah(angka){
return "Rp" + parseInt(angka).toLocaleString("id-ID");
}

function simpan(){

let biasa=document.getElementById("biasa").value;
let semir=document.getElementById("semir").value;
let premium=document.getElementById("premium").value;
let steam=document.getElementById("steam").value;

document.getElementById("hb").innerHTML=rupiah(biasa);
document.getElementById("hs").innerHTML=rupiah(semir);
document.getElementById("hp").innerHTML=rupiah(premium);
document.getElementById("ht").innerHTML=rupiah(steam);

alert("Pengaturan harga berhasil disimpan.");

}
    <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan - WANTO WASH</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100%;
    background:#0d6efd;
    color:white;
}

.sidebar h3{
    text-align:center;
    padding:20px;
}

.sidebar a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
}

.content{
    margin-left:250px;
    padding:30px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.logo-preview{
    width:150px;
    height:150px;
    border:2px dashed #ccc;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:white;
}

.logo-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

<div class="content">

<h2 class="mb-4">

<i class="bi bi-gear-fill"></i>

Pengaturan Aplikasi

</h2>

<div class="card p-4">

<div class="row">

<div class="col-md-4 text-center">

<div class="logo-preview mb-3">

<img id="previewLogo" src="" alt="Logo">

</div>

<input
type="file"
id="logo"
class="form-control"
accept="image/*">

</div>

<div class="col-md-8">

<label>Nama Usaha</label>

<input
type="text"
id="namaUsaha"
class="form-control mb-3"
placeholder="WANTO WASH">

<label>Alamat</label>

<textarea
id="alamat"
class="form-control mb-3"
rows="3"></textarea>

<label>No. Telepon</label>

<input
type="text"
id="telepon"
class="form-control mb-3">

<label>Harga Cuci Default (Rp)</label>

<input
type="number"
id="hargaDefault"
class="form-control mb-3"
placeholder="20000">

<div class="mt-3">

<button
class="btn btn-success"
onclick="simpanPengaturan()">

<i class="bi bi-save"></i>

Simpan

</button>

<button
class="btn btn-warning"
onclick="resetPengaturan()">

<i class="bi bi-arrow-clockwise"></i>

Reset

</button>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ===============================
// CEK LOGIN
// ===============================

if(localStorage.getItem("login")!="true"){
    location.href="login.html";
}

// ===============================
// AMBIL DATA PENGATURAN
// ===============================

let pengaturan =
JSON.parse(localStorage.getItem("pengaturan")) || {

nama_usaha:"WANTO WASH",
alamat:"",
telp:"",
harga_default:20000,
logo:""

};

// ===============================
// TAMPILKAN DATA
// ===============================

document.getElementById("namaUsaha").value =
pengaturan.nama_usaha;

document.getElementById("alamat").value =
pengaturan.alamat;

document.getElementById("telepon").value =
pengaturan.telp;

document.getElementById("hargaDefault").value =
pengaturan.harga_default;

if(pengaturan.logo!=""){

document.getElementById("previewLogo").src =
pengaturan.logo;

}

// ===============================
// SIMPAN PENGATURAN
// ===============================

function simpanPengaturan(){

pengaturan.nama_usaha =
document.getElementById("namaUsaha").value;

pengaturan.alamat =
document.getElementById("alamat").value;

pengaturan.telp =
document.getElementById("telepon").value;

pengaturan.harga_default =
Number(document.getElementById("hargaDefault").value);

localStorage.setItem(
"pengaturan",
JSON.stringify(pengaturan)
);

alert("Pengaturan berhasil disimpan.");

}
    // ===============================
// UPLOAD LOGO
// ===============================

document.getElementById("logo")
.addEventListener("change",function(e){

let file=e.target.files[0];

if(!file){

return;

}

let reader=new FileReader();

reader.onload=function(){

let hasil=reader.result;

document.getElementById("previewLogo").src=hasil;

pengaturan.logo=hasil;

};

reader.readAsDataURL(file);

});


// ===============================
// RESET PENGATURAN
// ===============================

function resetPengaturan(){

if(confirm("Kembalikan pengaturan ke awal?")){


localStorage.removeItem("pengaturan");


location.reload();


}

}


// ===============================
// CEK DATA OTOMATIS
// ===============================

window.onload=function(){


if(pengaturan.logo!=""){

document.getElementById("previewLogo").src =
pengaturan.logo;

}


};

</script>

</script>
