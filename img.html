<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Gambar - WANTO Wash</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:30px;
}

h1{
    text-align:center;
    color:#dc3545;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card img{
    width:180px;
    height:180px;
    object-fit:contain;
    border:1px solid #ddd;
    border-radius:10px;
    margin-bottom:15px;
}

.card h3{
    margin:10px 0;
}

.card p{
    color:#666;
    font-size:14px;
}

</style>

</head>
<body>

<h1>Asset Gambar WANTO Wash</h1>

<div class="container">

<div class="card">

<img src="img/logo.png"
onerror="this.src='https://via.placeholder.com/180?text=LOGO'">

<h3>logo.png</h3>

<p>Logo aplikasi WANTO Wash</p>

</div>

<div class="card">

<img src="img/no-image.png"
onerror="this.src='https://via.placeholder.com/180?text=NO+IMAGE'">

<h3>no-image.png</h3>

<p>Foto default jika belum upload</p>

</div>

<div class="card">

<img src="img/motor-default.png"
onerror="this.src='https://via.placeholder.com/180?text=MOTOR'">

<h3>motor-default.png</h3>

<p>Ikon motor</p>

</div>

<div class="card">

<img src="img/user.png"
onerror="this.src='https://via.placeholder.com/180?text=USER'">

<h3>user.png</h3>

<p>Foto admin/kasir</p>

</div>

<div class="card">

<img src="img/banner.jpg"
onerror="this.src='https://via.placeholder.com/180x100?text=BANNER'">

<h3>banner.jpg</h3>

<p>Banner Dashboard</p>

</div>

<div class="card">

<img src="img/favicon.ico"
onerror="this.src='https://via.placeholder.com/180?text=ICON'">

<h3>favicon.ico</h3>

<p>Icon Browser</p>

</div>

</div>

</body>
</html>
