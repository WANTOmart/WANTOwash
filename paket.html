    position:fixed;

    border:none;
    border-radius:15px;

<body>

<div class="sidebar">

<h3>🛵 WANTO WASH</h3>

<a href="transaksi.html"><i class="bi bi-cart-check"></i> Transaksi</a>

</div>

<div class="content">

<div class="d-flex justify-content-between mb-3">

<h2>Paket Cuci</h2>

<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalTambah">
<i class="bi bi-plus-circle"></i> Tambah Paket
</button>

</div>

<div class="card p-3">

<table class="table table-bordered table-hover">

<thead class="table-primary">

<tr>
<th>No</th>
<th>Nama Paket</th>
<th>Harga</th>
<th>Aksi</th>
</tr>

</thead>

<tbody id="tabelPaket">

</tbody>

</table>

</div>

</div>

<!-- Modal -->

<div class="modal fade" id="modalTambah">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>Tambah Paket</h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body">

<input id="namaPaket" class="form-control mb-3" placeholder="Nama Paket">

<input id="hargaPaket" type="number" class="form-control" placeholder="Harga">

</div>

<div class="modal-footer">

<button class="btn btn-success" onclick="simpanPaket()">
Simpan
</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

if(localStorage.getItem("login")!="true"){
location.href="login.html";
}

let paket = JSON.parse(localStorage.getItem("paket")) || [];

// Paket default

if(paket.length==0){

paket=[

{
nama:"Cuci Biasa",
harga:20000
},

{
nama:"Cuci + Semir Ban",
harga:25000
},

{
nama:"Cuci Premium",
harga:35000
},

{
nama:"Steam",
harga:40000
}

];

localStorage.setItem("paket",JSON.stringify(paket));

}

tampil();

function tampil(){

let html="";

paket.forEach(function(item,index){

html+=`

<tr>

<td>${index+1}</td>

<td>${item.nama}</td>

<td>Rp ${Number(item.harga).toLocaleString("id-ID")}</td>

<td>

<button class="btn btn-danger btn-sm"
onclick="hapus(${index})">

<i class="bi bi-trash"></i>

</button>

</td>

</tr>

`;

});

document.getElementById("tabelPaket").innerHTML=html;

}

function simpanPaket(){

let nama=document.getElementById("namaPaket").value;

let harga=document.getElementById("hargaPaket").value;

if(nama=="" || harga==""){

alert("Lengkapi data.");

return;

}

paket.push({

nama:nama,

harga:Number(harga)

});

localStorage.setItem(

"paket",

JSON.stringify(paket)

);

bootstrap.Modal.getInstance(

document.getElementById("modalTambah")

).hide();

document.getElementById("namaPaket").value="";

document.getElementById("hargaPaket").value="";

tampil();

}

function hapus(index){

if(confirm("Hapus paket ini?")){

paket.splice(index,1);

localStorage.setItem(

"paket",

JSON.stringify(paket)

);

tampil();

}

}

</script>

</body>
</html>
