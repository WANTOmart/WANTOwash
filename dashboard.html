<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - WANTO WASH</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100%;
    background:#0d6efd;
    color:#fff;
}

.sidebar h3{
    text-align:center;
    padding:20px;
}

.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    padding:15px 20px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.2);
}

.content{
    margin-left:250px;
    padding:30px;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

</style>

</head>
<body>

<div class="sidebar">

<h3>🛵 WANTO WASH</h3>

<a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
<a href="pelanggan.html"><i class="bi bi-people"></i> Data Pelanggan</a>
<a href="motor.html"><i class="bi bi-bicycle"></i> Data Motor</a>
<a href="paket.html"><i class="bi bi-tags"></i> Paket Cuci</a>
<a href="transaksi.html"><i class="bi bi-cart-check"></i> Transaksi</a>
<a href="pembayaran.html"><i class="bi bi-cash-stack"></i> Pembayaran</a>
<a href="nota.html"><i class="bi bi-printer"></i> Cetak Nota</a>
<a href="laporan.html"><i class="bi bi-bar-chart"></i> Laporan</a>
<a href="karyawan.html"><i class="bi bi-person-badge"></i> Karyawan</a>
<a href="pengaturan.html"><i class="bi bi-gear"></i> Pengaturan</a>

<hr>

<a href="#" onclick="logout()">
<i class="bi bi-box-arrow-right"></i>
Logout
</a>

</div>

<div class="content">

<h2>Dashboard</h2>

<p>
Selamat Datang,
<b id="admin"></b>
</p>

<div class="row">

<div class="col-md-3 mb-3">
<div class="card p-3 text-center">
<h2 id="pelanggan">0</h2>
<h5>Pelanggan</h5>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card p-3 text-center">
<h2 id="motor">0</h2>
<h5>Motor</h5>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card p-3 text-center">
<h2 id="transaksi">0</h2>
<h5>Transaksi</h5>
</div>
</div>

<div class="col-md-3 mb-3">
<div class="card p-3 text-center">
<h2 id="karyawan">0</h2>
<h5>Karyawan</h5>
</div>
</div>

</div>

<div class="row">

<div class="col-md-6">

<div class="card p-4">

<h4>Total Pendapatan</h4>

<h1 class="text-success" id="pendapatan">
Rp0
</h1>

</div>

</div>

<div class="col-md-6">

<div class="card p-4">

<h4>Status Login</h4>

<p class="text-success">
✔ Login Berhasil
</p>

</div>

</div>

</div>

</div>

<script>

//cek login

if(localStorage.getItem("login")!="true"){

window.location.href="login.html";

}

//nama admin

document.getElementById("admin").innerHTML=
localStorage.getItem("username");

//ambil data

let pelanggan=
JSON.parse(localStorage.getItem("pelanggan")) || [];

let motor=
JSON.parse(localStorage.getItem("motor")) || [];

let transaksi=
JSON.parse(localStorage.getItem("transaksi")) || [];

let karyawan=
JSON.parse(localStorage.getItem("karyawan")) || [];

//jumlah data

document.getElementById("pelanggan").innerHTML=
pelanggan.length;

document.getElementById("motor").innerHTML=
motor.length;

document.getElementById("transaksi").innerHTML=
transaksi.length;

document.getElementById("karyawan").innerHTML=
karyawan.length;

//total pendapatan

let total=0;

transaksi.forEach(function(item){

total+=Number(item.total || 0);

});

document.getElementById("pendapatan").innerHTML=
"Rp"+total.toLocaleString("id-ID");

//logout

function logout(){

if(confirm("Yakin ingin logout?")){

localStorage.removeItem("login");
localStorage.removeItem("username");

window.location.href="login.html";

}

}

</script>

</body>
</html>
