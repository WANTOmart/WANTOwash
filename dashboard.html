<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - WANTOwash</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #2563eb;
            --sidebar-width: 260px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* Sidebar Styling */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: linear-gradient(180deg, #1e40af 0%, #1e3a8a 100%);
            color: white;
            overflow-y: auto;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
        }

        .sidebar .brand-container {
            padding: 24px 20px;
            background: rgba(0, 0, 0, 0.15);
        }

        .sidebar .nav-link-custom {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            border-left: 4px solid transparent;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .sidebar .nav-link-custom:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar .nav-link-custom.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.18);
            border-left-color: #f59e0b;
            font-weight: 600;
        }

        /* Main Content */
        .content {
            margin-left: var(--sidebar-width);
            padding: 32px;
            transition: all 0.3s ease;
        }

        /* Metric Cards - Enhanced Colors & Gradients */
        .card-stat {
            border: none;
            border-radius: 18px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .card-stat:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06) !important;
        }

        .card-stat .icon-wrapper {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
        }

        /* Gradient Theme Accents */
        .stat-pelanggan { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); }
        .icon-pelanggan { background: #2563eb; color: #ffffff; }

        .stat-motor { background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); }
        .icon-motor { background: #16a34a; color: #ffffff; }

        .stat-transaksi { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); }
        .icon-transaksi { background: #d97706; color: #ffffff; }

        .stat-karyawan { background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%); }
        .icon-karyawan { background: #9333ea; color: #ffffff; }

        .stat-pendapatan { background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #ffffff; }
        .icon-pendapatan { background: rgba(255, 255, 255, 0.2); color: #ffffff; }

        /* Custom Refresh Button Styling */
        .btn-refresh-custom {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff !important;
            border: none;
            border-radius: 10px;
            padding: 8px 18px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: all 0.3s ease;
        }

        .btn-refresh-custom:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        /* Custom Cards & Tables */
        .custom-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            background: #ffffff;
        }

        .table th {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.6px;
            color: #64748b;
            background-color: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
            padding: 14px;
        }

        .table td {
            padding: 14px;
            vertical-align: middle;
        }

        /* Responsive Mobile Header */
        .mobile-header {
            display: none;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 998;
        }

        @media (max-width: 991.98px) {
            .sidebar {
                left: calc(-1 * var(--sidebar-width));
            }

            .sidebar.active {
                left: 0;
            }

            .content {
                margin-left: 0;
                padding: 20px 16px;
            }

            .mobile-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: #1e40af;
                color: white;
                padding: 14px 20px;
                position: sticky;
                top: 0;
                z-index: 999;
            }

            .overlay.active {
                display: block;
            }
        }
    </style>
</head>

<body>

            <i class="bi bi-list fs-1"></i>
        </button>
        <h4 class="m-0 fw-bold">WANTO<span class="text-warning">wash</span></h4>
        <div style="width: 32px;"></div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar d-flex flex-column" id="sidebar">
        <div class="brand-container text-center">
            <img src="img/logo.jpeg" alt="Logo WANTOwash" class="shadow-sm mb-2"

                onerror="this.onerror=null; this.src='https://via.placeholder.com/70?text=Wash';">
            <h4 class="m-0 fw-bold">WANTO<span class="text-warning">wash</span></h4>
        </div>
