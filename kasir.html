<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir - WANTO Wash</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:250px;
height:100%;
background:#111827;
}

.logo{
padding:20px;
text-align:center;
color:white;
border-bottom:1px solid #333;
}

.logo h2{
color:#ff3b3b;
}

.logo span{
color:#2196f3;
}

.menu{
list-style:none;
margin-top:20px;
}

.menu li a{
display:block;
padding:15px 20px;
text-decoration:none;
color:white;
}

.menu li a:hover,
.menu li a.active{
background:#dc3545;
}

.content{
margin-left:250px;
padding:25px;
}

.card{
background:white;
border-radius:10px;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.row{
display:flex;
gap:20px;
margin-bottom:15px;
}

.col{
flex:1;
}

label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

input,
select{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
}

.btn{
padding:12px 20px;
border:none;
border-radius:5px;
cursor:pointer;
color:white;
font-size:15px;
}

.simpan{
background:#28a745;
}

.cetak{
background:#007bff;
}

.reset{
background:#6c757d;
}

.btn:hover{
opacity:.9;
}

h1{
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

<h2>WANTO <span>Wash</span></h2>

<p>Sistem Kasir</p>

</div>

<ul class="menu">

<li><a href="dashboard.html"><i class="fa fa-home"></i> Dashboard</a></li>

<li><a class="active" href="kasir.html"><i class="fa fa-cash-register"></i> Kasir</a></li>

<li><a href="harga.html"><i class="fa fa-tags"></i> Daftar Harga</a></li>

<li><a href="laporan.html"><i class="fa fa-chart-line"></i> Laporan</a></li>

<li><a href="setting.html"><i class="fa fa-cog"></i> Setting</a></li>

</ul>

</div>

<div class="content">

<h1><i class="fa fa-cash-register"></i> Kasir WANTO Wash</h1>

<div class="card">

<div class="row">

<div class="col">

<label>No Transaksi</label>

<input type="text" value="WW001" readonly>

</div>

<div class="col">

<label>Tanggal</label>

<input type="date">

</div>

</div>

<div class="row">

<div class="col">

<label>Foto Motor</label>

<input type="file">

</div>

<div class="col">

<label>Nama Pelanggan</label>

<input type="text" placeholder="Nama Pelanggan">

</div>

</div>

<div class="row">

<div class="col">

<label>No. HP</label>

<input type="text" placeholder="08xxxxxxxxxx">

</div>

<div class="col">

<label>Plat Nomor</label>

<input type="text" placeholder="B 1234 ABC">

</div>

</div>

<div class="row">

<div class="col">

<label>Merk Motor</label>

<input type="text" placeholder="Honda Beat">

</div>

<div class="col">

<label>Warna Motor</label>

<input type="text" placeholder="Hitam">

</div>

</div>

<div class="row">

<div class="col">

<label>Paket Cuci</label>

<select id="paket" onchange="hitungHarga()">

<option value="15000">Cuci Motor - Rp15.000</option>

<option value="20000">Cuci + Semir Ban - Rp20.000</option>

<option value="25000">Cuci Premium - Rp25.000</option>

<option value="30000">Cuci Mesin - Rp30.000</option>

</select>

</div>

<div class="col">

<label>Harga</label>

<input type="number" id="harga" value="15000" readonly>

</div>

</div>

<div class="row">

<div class="col">

<label>Bayar</label>

<input type="number" id="bayar" onkeyup="hitungKembali()">

</div>

<div class="col">

<label>Kembalian</label>

<input type="number" id="kembali" readonly>

</div>

</div>

<br>

<button class="btn simpan">
<i class="fa fa-save"></i>
Simpan
</button>

<button class="btn cetak" onclick="window.print()">
<i class="fa fa-print"></i>
Cetak Nota
</button>

<button class="btn reset" onclick="location.reload()">
<i class="fa fa-refresh"></i>
Reset
</button>

</div>

</div>

<script>

function hitungHarga(){

let harga=document.getElementById("paket").value;

document.getElementById("harga").value=harga;

hitungKembali();

}

function hitungKembali(){

let harga=parseInt(document.getElementById("harga").value)||0;

let bayar=parseInt(document.getElementById("bayar").value)||0;

document.getElementById("kembali").value=bayar-harga;

}

</script>

</body>
</html>
