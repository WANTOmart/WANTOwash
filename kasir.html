<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - WANTO Wash</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* --- RESET & BASIC STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f4f6f9;
            color: #333;
            min-height: 100vh;
        }

        /* --- MOBILE NAVBAR HEADER --- */
        .mobile-navbar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #111827;
            color: white;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 1001;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .mobile-navbar .menu-toggle {
            font-size: 22px;
            cursor: pointer;
            color: white;
            background: none;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
        }

        .mobile-navbar .menu-toggle:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .mobile-navbar .brand-name {
            font-size: 18px;
            font-weight: bold;
            color: #ff3b3b;
            letter-spacing: 0.5px;
        }

        .mobile-navbar .brand-name span {
            color: #2196f3;
        }

        /* --- SIDEBAR NAVIGASI --- */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100%;
            background: #111827;
            color: white;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        .logo {
            padding: 20px 15px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }

        .logo h2 {
            color: #ff3b3b;
            font-size: 22px;
            font-weight: 700;
        }

        .logo span {
            color: #2196f3;
        }

        .logo p {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 2px;
        }

        .menu {
            list-style: none;
            margin-top: 10px;
        }

        .menu li {
            border-bottom: 1px solid #1f2937;
        }

        .menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: #d1d5db;
            text-decoration: none;
            font-size: 15px;
            transition: background 0.2s, color 0.2s;
        }

        .menu li a i {
            width: 20px;
            text-align: center;
            font-size: 16px;
        }

        .menu li a:hover, .menu li a.active {
            background: #dc3545;
            color: white;
        }

        /* --- OVERLAY MOBILE --- */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            display: block;
            opacity: 1;
        }

        /* --- CONTENT AREA --- */
        .content {
            margin-left: 250px;
            padding: 25px;
            transition: margin-left 0.3s ease;
        }

        .content h1 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 2px 10px rgba(0,0,0,.04);
        }

        /* --- FORM LAYOUT --- */
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }

        .col {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2196f3;
        }

        input[readonly] {
            background-color: #f3f4f6;
            color: #6b7280;
        }

        /* --- BUTTONS --- */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .simpan { background: #28a745; }
        .simpan:hover { background: #218838; }

        .cetak { background: #007bff; }
        .cetak:hover { background: #0069d9; }

        .reset { background: #6c757d; }
        .reset:hover { background: #5a6268; }

        /* --- MEDIA QUERIES (HP & TABLET) --- */
        @media (max-width: 768px) {
            .mobile-navbar {
                display: flex;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .content {
                margin-left: 0;
                padding: 75px 15px 20px 15px;
            }

            .content h1 {
                font-size: 18px;
            }

            .card {
                padding: 15px;
            }

            .row {
                flex-direction: column; /* Mengubah form menjadi 1 kolom vertikal di HP */
                gap: 15px;
                margin-bottom: 15px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%; /* Tombol memenuhi lebar layar HP */
            }
        }
    </style>
</head>

<body>

    <div class="mobile-navbar">
        <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Buka Menu">
            <i class="fas fa-bars"></i>
        </button>
        <div class="brand-name">WANTO <span>Wash</span></div>
        <div style="width: 30px;"></div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="logo">
            <h2>WANTO <span>Wash</span></h2>
            <p>Sistem Kasir</p>
        </div>

        <ul class="menu">
            <li><a href="index.html"><i class="fa fa-home"></i> Dashboard</a></li>
            <li><a class="active" href="kasir.html"><i class="fa fa-cash-register"></i> Kasir</a></li>
            <li><a href="harga.html"><i class="fa fa-tags"></i> Daftar Harga</a></li>
            <li><a href="laporan.html"><i class="fa fa-chart-line"></i> Laporan</a></li>
            <li><a href="setting.html"><i class="fa fa-cog"></i> Setting</a></li>
        </ul>
    </div>

    <div class="content">
        <h1><i class="fa fa-cash-register"></i> Kasir WANTO Wash</h1>

        <div class="card">
            <div class="row">
                <div class="col">
                    <label>No Transaksi</label>
                    <input type="text" value="WW001" readonly>
                </div>
                <div class="col">
                    <label>Tanggal</label>
                    <input type="date" id="tanggal">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Foto Motor</label>
                    <input type="file" accept="image/*">
                </div>
                <div class="col">
                    <label>Nama Pelanggan</label>
                    <input type="text" placeholder="Nama Pelanggan">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>No. HP</label>
                    <input type="tel" placeholder="08xxxxxxxxxx">
                </div>
                <div class="col">
                    <label>Plat Nomor</label>
                    <input type="text" placeholder="B 1234 ABC">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Merk Motor</label>
                    <input type="text" placeholder="Honda Beat">
                </div>
                <div class="col">
                    <label>Warna Motor</label>
                    <input type="text" placeholder="Hitam">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Paket Cuci</label>
                    <select id="paket" onchange="hitungHarga()">
                        <option value="15000">Cuci Motor - Rp15.000</option>
                        <option value="20000">Cuci + Semir Ban - Rp20.000</option>
                        <option value="25000">Cuci Premium - Rp25.000</option>
                        <option value="30000">Cuci Mesin - Rp30.000</option>
                    </select>
                </div>
                <div class="col">
                    <label>Harga</label>
                    <input type="number" id="harga" value="15000" readonly>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Bayar</label>
                    <input type="number" id="bayar" placeholder="0" onkeyup="hitungKembali()">
                </div>
                <div class="col">
                    <label>Kembalian</label>
                    <input type="number" id="kembali" value="0" readonly>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn simpan">
                    <i class="fa fa-save"></i> Simpan
                </button>
                <button class="btn cetak" onclick="window.print()">
                    <i class="fa fa-print"></i> Cetak Nota
                </button>
                <button class="btn reset" onclick="location.reload()">
                    <i class="fa fa-rotate-right"></i> Reset
                </button>
            </div>
        </div>
    </div>

    <script>
        // Set tanggal otomatis ke hari ini
        document.getElementById('tanggal').valueAsDate = new Date();

        // Navigasi Mobile Sidebar Toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // Kalkulasi Harga & Kembalian
        function hitungHarga() {
            let harga = document.getElementById("paket").value;
            document.getElementById("harga").value = harga;
            hitungKembali();
        }

        function hitungKembali() {
            let harga = parseInt(document.getElementById("harga").value) || 0;
            let bayar = parseInt(document.getElementById("bayar").value) || 0;
            let kembali = bayar - harga;
            
            document.getElementById("kembali").value = kembali < 0 ? 0 : kembali;
        }

        // Otomatis tutup sidebar jika ukuran layar diubah melebihi 768px
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                document.getElementById('sidebar').classList.remove('active');
                document.getElementById('overlay').classList.remove('active');
            }
        });
    </script>
</body>
</html>
